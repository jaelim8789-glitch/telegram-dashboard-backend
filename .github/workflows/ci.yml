name: Backend CI

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']

env:
  DATABASE_URL: postgresql+asyncpg://telegram_dashboard:telegram_dashboard@localhost:5432/telegram_dashboard
  ENCRYPTION_KEY: "ci-test-encryption-key-not-for-prod-but-32bytes!!"

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: telegram_dashboard
          POSTGRES_PASSWORD: telegram_dashboard
          POSTGRES_DB: telegram_dashboard
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - run: |
          pip install uv
          uv pip install --system -r requirements.txt -r requirements-dev.txt
        name: Install Python deps (uv)

      - run: alembic upgrade head
        name: Apply migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}

      - run: python -c "import sys; sys.path.insert(0, '.'); from app.main import app; print('import OK')"
        name: Import check
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}

      - run: python -m pytest tests/ -q --tb=short --timeout=30 2>&1 | tail -60
        name: Run tests
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
