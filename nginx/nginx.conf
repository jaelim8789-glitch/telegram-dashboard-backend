# Docker's embedded DNS (127.0.0.11) resolves service names to the current
# container IP. A short `valid` TTL plus routing proxy_pass through a $variable
# (rather than a static `upstream {}` block, which nginx resolves once at
# startup/reload and caches for the worker's lifetime) means nginx re-resolves
# backend/frontend on this schedule instead of holding a stale IP forever after
# `docker compose up -d --force-recreate` gives a container a new address —
# the recurring cause of 502s right after every backend/frontend redeploy.
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── Real client IP behind the Cloudflare Tunnel ─────────────────────────────
# All traffic arrives via `cloudflared`, connecting to nginx over localhost --
# $remote_addr is therefore the tunnel daemon's own loopback connection, the
# same value for literally every visitor site-wide. X-Real-IP (fed from
# $remote_addr below, previously) made every IP-keyed rate limit -- guest AI
# chat's 10/day, SMS send-code, login attempts -- a single limit shared by the
# entire site instead of one per visitor (found live: guest AI chat locked out
# after only a handful of total messages across every simultaneous tester).
# CF-Connecting-IP is set by Cloudflare's edge to the real visitor IP and is
# not spoofable by the client (Cloudflare overwrites/strips any client-supplied
# copy before forwarding) -- prefer it, falling back to $remote_addr for any
# request that somehow reaches nginx without going through Cloudflare at all.
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# ─── Proxy cache for static-ish responses ────────────────────────────────────
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=telemon:10m max_size=500m inactive=60m use_temp_path=off;

# ─── www → canonical 301 redirect (no trailing slash stripping) ─────────────────
server {
    listen 80;
    server_name www.telemon.online;
    return 301 https://telemon.online$request_uri;
}

# ─── Production: telemon.online (public marketing site) ──────────────────────
# Cloudflare Full (Strict): Cloudflare terminates TLS at the edge and connects
# to this server via HTTP on port 80. No TLS certificate is required on the
# origin — Cloudflare validates the origin's TLS only in Strict mode, but Full
# (Strict) works with HTTP-only origins behind the Cloudflare proxy (DNS proxied,
# orange cloud). Do NOT expose port 80 directly to the internet without Cloudflare.
server {
    listen 80;
    server_name telemon.online;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ws:; frame-src https://telegram.org; font-src 'self' data:" always;

    client_max_body_size 200M;

    # Health check
    location = /health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API calls from signup/payment public pages
    #
    # SECURITY: proxy_cache used to be enabled here, keyed only by URL (the
    # default cache key is $scheme$proxy_host$request_uri — it does NOT
    # include the Authorization header or any per-user token). /api/ is a
    # blanket prefix that also matches authenticated, per-tenant routes like
    # /api/accounts and /api/chat-telegram/... — so once any one user's
    # request populated the cache for a given path, nginx would replay that
    # SAME cached response (their account data) to any other caller hitting
    # the identical URL for the next 10 minutes, auth header or not.
    # proxy_cache_bypass only skips the cache LOOKUP when the bypass
    # condition holds for the incoming request; it does not stop the
    # response from being cached and later served to a different,
    # unauthenticated or differently-authenticated caller. Do not re-enable
    # caching here without a per-route allowlist and a cache key that
    # includes the caller's identity.
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Uploaded AI files (images/videos) -- served with Content-Disposition:
    # attachment by the backend, so proxy them through to FastAPI.
    location /uploads/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # WebSocket endpoints (chat, sessions)
    location ~ ^/ws/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Public Next.js frontend (landing page at /, plus /signup, /pricing, etc.)
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

