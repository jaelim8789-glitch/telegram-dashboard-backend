# TeleMon Production Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from base compose:
#   - Stricter resource limits
#   - Log rotation
#   - Graceful shutdown
#   - No build contexts (uses pre-built images)
#
# NOTE: this file previously declared `secrets: {..., external: true}` for
# NOWPAYMENTS_API_KEY/IPN_SECRET and blanked the env vars below to force
# reading from the secret file instead. External secrets are a Swarm-only
# Docker feature -- this host runs plain `docker compose` (not swarm), so
# `docker compose up` rejected the whole deploy ("unsupported external
# secret"), and app/config.py only ever read os.getenv() and never the
# mounted secret file, so even a successful deploy would have shipped with
# a blank NOWPAYMENTS_API_KEY. Reverted to plain env vars sourced from
# .env via the base docker-compose.yml (DATABASE_URL etc. below still
# override the base file's dev defaults for prod).

services:
  backend:
    build: !reset null
    image: ghcr.io/${GHCR_OWNER:-telemon}/telemon-backend:${TAG:-latest}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 512M
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      DATABASE_URL: postgresql+asyncpg://telegram_dashboard:telegram_dashboard@db:5432/telegram_dashboard
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

  frontend:
    build: !reset null
    image: ghcr.io/${GHCR_OWNER:-telemon}/telemon-frontend:${TAG:-latest}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
